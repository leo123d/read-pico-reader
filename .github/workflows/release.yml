name: release

# 用产品默认配置（sdkconfig.defaults）编译真机固件，产出可烧写的 bin，
# 并把网页烧录器（webflash/）连同固件一起发布到 GitHub Pages。
# Builds real-hardware firmware with the product defaults (sdkconfig.defaults),
# then publishes the web flasher (webflash/) with the binaries to GitHub Pages.
#
# 编译回归（只用 sdkconfig.ci 验证能否编过）在 build.yml。
# Compile-only regression (sdkconfig.ci) lives in build.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点，与 build.yml 一致。/ Pinned to v6.1, same as build.yml.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          # 注意：merge-bin 以 build/ 为工作目录，-o 的路径相对 build/ 解析。
          # 写成 build/xxx.bin 会落到 build/build/xxx.bin，务必用裸文件名。
          # NOTE: merge-bin runs with cwd=build/, so -o resolves relative to build/.
          # Passing build/xxx.bin would land in build/build/xxx.bin — use a bare filename.
          idf.py merge-bin -o Read_Pico-merged.bin

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      - name: assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp webflash/index.html site/
          cp webflash/manifest.json site/
          cp build/bootloader/bootloader.bin site/firmware/
          cp build/partition_table/partition-table.bin site/firmware/
          cp build/Read_Pico.bin site/firmware/
          # 合并镜像必须存在：缺失说明 merge-bin 出错，直接失败而不是发出 404 链接。
          # The merged image must exist: a missing file means merge-bin broke,
          # so fail loudly instead of shipping a 404 link.
          cp build/Read_Pico-merged.bin site/firmware/
          ls -l site site/firmware

      - name: verify site
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html manifest.json \
                   firmware/bootloader.bin \
                   firmware/partition-table.bin \
                   firmware/Read_Pico.bin \
                   firmware/Read_Pico-merged.bin; do
            test -s "site/$f" || { echo "MISSING or empty: site/$f"; exit 1; }
            echo "ok  $(du -h "site/$f" | cut -f1)  $f"
          done

      - name: upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: read-pico-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/Read_Pico.bin
            build/Read_Pico-merged.bin
          if-no-files-found: error

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
